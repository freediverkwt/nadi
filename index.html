// النمو السعري فقط
function fv(principal, rate, years, pmt) {
  const rm = Math.pow(1 + rate, 1/12) - 1;
  const n = years * 12;
  const g = Math.pow(1 + rm, n);
  return principal * g + (rm > 0 ? pmt * ((g - 1) / rm) : pmt * n);
}

// النمو مع التوزيعات — يعيد {total, price, divs}
// عند إعادة الاستثمار تُضاف التوزيعات لرأس المال وتنمو معه
function fvWithYield(principal, rate, yieldRate, years, pmt, reinvest) {
  const priceOnly = fv(principal, rate, years, pmt);

  if (!yieldRate) return { total: priceOnly, price: priceOnly, divs: 0 };

  if (reinvest) {
    const total = fv(principal, rate + yieldRate, years, pmt);
    return { total, price: priceOnly, divs: total - priceOnly };
  }

  // بدون إعادة استثمار: تُجمع التوزيعات نقدًا سنة بسنة دون نمو
  let divs = 0;
  for (let y = 1; y <= years; y++) {
    const base = fv(principal, rate, y, pmt);
    divs += base * yieldRate;
  }
  return { total: priceOnly + divs, price: priceOnly, divs };
}

// ينادي الوسيط على الخادم
async function ask(prompt, search = true, tries = 3) {
  let last = null;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, search }),
      });
      const d = await r.json();
      if (!r.ok) {
        last = new Error(d.error || `رمز ${r.status}`);
        if (r.status >= 500 || r.status === 429) { await sleep(1500 * (i + 1)); continue; }
        throw last;
      }
      const clean = (d.text || "").replace(/```json|```/g, "").trim();
      const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
      if (s === -1 || e === -1) { last = new Error("رد غير مفهوم"); await sleep(1000); continue; }
      return JSON.parse(clean.slice(s, e + 1));
    } catch (err) { last = err; await sleep(1200 * (i + 1)); }
  }
  throw last || new Error("تعذّر التنفيذ");
}

// يقرأ الأسعار من الشيت المنشور بصيغة بيانات
async function readSheet(url, tickers) {
  let text = null;
  let lastErr = null;

  // نجرب المسار المباشر أولًا، ثم وسيطًا يتجاوز قيود المتصفح
  const routes = [
    url,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://corsproxy.io/?" + encodeURIComponent(url),
  ];

  for (const u of routes) {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (!r.ok) { lastErr = new Error(`رمز ${r.status}`); continue; }
      const t = await r.text();
      // نتأكد أن المحتوى فعلًا بيانات وليس صفحة خطأ
      if (t && t.length > 40 && !/^\s*</.test(t)) { text = t; break; }
      lastErr = new Error("المحتوى غير صالح");
    } catch (e) { lastErr = e; }
  }

  if (!text) throw new Error(
    "تعذّر قراءة الرابط" + (lastErr ? ` (${lastErr.message})` : "") +
    " — تأكد أن الشيت منشور بصيغة CSV"
  );

  const prices = {};
  text.split(/\r?\n/).forEach(line => {
    const cells = [];
    let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { q = !q; continue; }
      if (c === "," && !q) { cells.push(cur); cur = ""; continue; }
      cur += c;
    }
    cells.push(cur);
    const clean = cells.map(x => x.replace(/[$,"٪%\s]/g, "").trim());
    const raw   = cells.map(x => x.trim());

    let idx = -1, ticker = null;
    for (let i = 0; i < raw.length; i++) {
      const hit = tickers.find(k => k.trim().toUpperCase() === raw[i].toUpperCase());
      if (hit) { idx = i; ticker = hit; break; }
    }
    if (idx === -1) return;

    const nums = clean.slice(idx + 1).map(parseFloat).filter(n => !isNaN(n));
    if (!nums.length) return;

    // ورقة أسعار بسيطة: الاسم ثم السعر
    if (nums.length === 1) prices[ticker] = nums[0];
    // الشيت الكامل: الكمية، التكلفة، إجمالي التكلفة، سعر السوق
    else if (nums.length >= 4) prices[ticker] = nums[3];
    else prices[ticker] = nums[nums.length - 1];
  });

  if (!Object.keys(prices).length) throw new Error("ما لقى أي سهم في الرابط");
  return prices;
}

        )}

          type="password"
          value={p}

          autoFocus
          style={{ ...S.input, marginTop:0, textAlign:"center", fontSize:16, padding:"13px 14px" }}
        />

        <label style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:8, margin:"16px 0 20px", fontSize:12.5, color:"#8CA396", cursor:"pointer" }}>
          <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />
          تذكّرني على هذا الجهاز
        </label>

        {err && <div style={{ ...S.err, marginBottom:16 }}>{err}</div>}

        <button onClick={submit} disabled={busy || !p.trim()}
          style={{ ...S.primary, width:"100%", padding:"13px", fontSize:14, opacity: busy || !p.trim() ? 0.5 : 1 }}>
          {busy ? "جاري التحقق…" : "دخول"}
        </button>

        <div style={{ ...S.dim, fontSize:11, marginTop:24, lineHeight:1.8 }}>
          بياناتك محفوظة على الخادم ومحمية بكلمة المرور
        </div>
      </div>
    </div>
  );
}

  const [returns, setReturns]   = useState(st?.returns || DEFAULT_RETURNS);
  const [monthly, setMonthly]   = useState(st?.monthly ?? 15432);
  const [yields, setYields]     = useState(st?.yields || DEFAULT_YIELDS);
  const [reinvest, setReinvest] = useState(st?.reinvest ?? true);
  const [live, setLive]         = useState(st?.live || null);

  const [sheetUrl, setSheetUrl] = useState(load(SHEET_KEY, ""));

  const [syncing, setSyncing]   = useState(false);
  const [clearing, setClearing] = useState(false);
  const [msg, setMsg]           = useState(null);

  const [ready, setReady]       = useState(false);
  const [cloudState, setCloud]  = useState("idle");
  const first = useRef(true);

  // جلب البيانات من الخادم عند الفتح
  useEffect(() => {
    (async () => {
      try {
        const d = await cloudGet(pass);
        if (d) {
          if (d.holdings) setHoldings(d.holdings);
          if (typeof d.cash === "number") setCash(d.cash);
          if (d.frozen) setFrozen(d.frozen);
          if (d.cur) setCur(d.cur);
          if (typeof d.rate === "number") setRate(d.rate);
          if (d.returns) setReturns(d.returns);
          if (typeof d.monthly === "number") setMonthly(d.monthly);
          if (d.yields) setYields(d.yields);
          if (typeof d.reinvest === "boolean") setReinvest(d.reinvest);
          if (d.live) setLive(d.live);
          if (typeof d.sheetUrl === "string") setSheetUrl(d.sheetUrl);
        }
      } catch (e) {
        if (e.message === "AUTH") { onLogout(); return; }
      }
      setReady(true);
    })();
  }, []);

  // الحفظ على الخادم مع نسخة محلية احتياطية
  useEffect(() => {
    if (!ready) return;
    if (first.current) { first.current = false; return; }

    const bundle = { holdings, cash, frozen, cur, rate, returns, monthly, live, yields, reinvest, sheetUrl };
    save(DATA_KEY, bundle);
    save(SHEET_KEY, sheetUrl);

    setCloud("saving");
    const t = setTimeout(async () => {
      try {
        await cloudSet(pass, bundle);
        setCloud("saved");
        setTimeout(() => setCloud("idle"), 1600);
      } catch (e) {
        setCloud(e.message === "AUTH" ? "auth" : "error");
      }
    }, 700);
    return () => clearTimeout(t);
  }, [holdings, cash, frozen, cur, rate, returns, monthly, live, yields, reinvest, sheetUrl, ready]);

  const M = useMemo(() => {
    const sym = cur === "USD" ? "$" : "د.ك ";
    return (v, d = 0) => sym + (cur === "USD" ? v : v / rate)
      .toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }, [cur, rate]);

  const rows = useMemo(() => holdings.map(h => {
    const value = num(h.qty * h.price), basis = num(h.qty * h.cost);
    return { ...h, value, basis, pl: value - basis, plPct: basis > 0 ? (value - basis) / basis : 0 };
  }), [holdings]);

  const invested = rows.reduce((s, r) => s + r.value, 0);
  const total    = invested + cash;
  const basis    = rows.reduce((s, r) => s + r.basis, 0);
  const totalPL  = invested - basis;

  const byLine = useMemo(() => {
    const m = {};
    ORDER.forEach(k => {
      const list = rows.filter(r => r.line === k).sort((a, b) => b.value - a.value);
      const v = list.reduce((s, r) => s + r.value, 0);
      const b = list.reduce((s, r) => s + r.basis, 0);
      // الوزن يُقاس على المبلغ المستثمر فقط — السيولة تُعرض منفصلة ولا تدخل التوزيع
      m[k] = { list, value: v, basis: b,
               weight: invested > 0 ? v / invested : 0,
               gap: LINES[k].target * invested - v };
    });
    return m;
  }, [rows, invested]);

  const biggest = rows.reduce((a, b) => (b.value > (a?.value ?? 0) ? b : a), null);
  const conc = biggest && total > 0 ? biggest.value / total : 0;
    // نسبة التوازن تُقاس على المبلغ المستثمر فقط — الكاش غير الموزّع لا يدخل الحساب
  const drift = invested > 0
    ? ORDER.reduce((s, k) => s + Math.abs(byLine[k].weight - LINES[k].target), 0)
    : 0;
  const progress = invested > 0 ? Math.max(0, Math.min(1, 1 - drift / 1.2)) : 0;

  const flash = (ok, text) => { setMsg({ ok, text }); setTimeout(() => setMsg(null), 9000); };

  const syncPrices = async () => {
    if (!sheetUrl) { setSetup(true); return; }
    setSyncing(true);
    try {
      const prices = await readSheet(sheetUrl, holdings.map(h => h.ticker));

      // نحسب النتيجة أولًا ثم نحدّث الحالة — حتى تكون الرسالة دقيقة
      let n = 0;
      const skip = [], missing = [];

      const next = holdings.map(h => {
        const p = prices[h.ticker];
        if (typeof p === "number" && p > 0) {
          if (h.price > 0 && Math.abs(p - h.price) / h.price > 0.6) { skip.push(h.ticker); return h; }
          n++; return { ...h, price: p };
        }
        if (h.qty > 0) missing.push(h.ticker);
        return h;
      });

      setHoldings(next);

      const notes = [];
      if (skip.length) notes.push(`تُخطّي ${skip.join("، ")} لتغيّر مشبوه`);
      if (missing.length) notes.push(`ما وُجد في الورقة: ${missing.slice(0, 5).join("، ")}`);

      flash(n > 0, n > 0
        ? `تم تحديث ${n} سعر${notes.length ? " · " + notes.join(" · ") : ""}`
        : "ما تطابق أي سهم مع الورقة — تأكد أن الأسماء مطابقة للرموز في تبويب المراكز");
    } catch (e) {
      flash(false, e.message);
    }
    setSyncing(false);
  };

  const saveHolding = (h) => {
    setHoldings(p => { const i = p.findIndex(x => x.id === h.id); if (i === -1) return [...p, h]; const c = [...p]; c[i] = h; return c; });
    setEditing(null);
  };
  const removeHolding = (id) => { setHoldings(p => p.filter(x => x.id !== id)); setFrozen(f => f.filter(x => x !== id)); setEditing(null); };
  const toggleFreeze = (id) => setFrozen(f => f.includes(id) ? f.filter(x => x !== id) : [...f, id]);

  if (!ready) return (
    <div style={{ ...S.shell, display:"grid", placeItems:"center", minHeight:"100vh" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ ...S.spinner, margin:"0 auto 16px" }} />
        <div style={{ color:"#6E8A7C", fontSize:13.5 }}>جاري تحميل محفظتك…</div>
      </div>
    </div>
  );

  const TABS = [["pitch","التشكيلة"],["squad","المراكز"],["analysis","التحليل"],["livetab","تحليل حي"],["future","المستقبل"],["risk","الإنذار"],["plan","خطة الشراء"]];

  return (
    <div style={S.shell}>
      <header style={S.header}>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <Crest />
          <div>
            <h1 style={S.h1}>نادي المحفظة</h1>
            <div style={S.sub}>
              موسم إعادة التوازن
              {!IS_OWNER && <span style={{ color:"#37C793", fontFamily:MONO }}> · {USER}</span>}
            </div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <button onClick={syncPrices} disabled={syncing} style={{ ...S.syncBtn, opacity: syncing ? 0.55 : 1 }}>
            {syncing ? "⟳ جاري السحب…" : "⟳ أسعار الشيت"}
          </button>
          <CloudBadge state={cloudState} />
          <button onClick={() => setSetup(true)} style={S.gearBtn}>⚙</button>
          <button onClick={onLogout} style={S.gearBtn} title="خروج">⏻</button>
          <div style={S.segment}>
            {["USD","KWD"].map(c => (
              <button key={c} onClick={() => setCur(c)} style={{ ...S.segBtn, ...(cur===c?S.segOn:{}) }}>
                {c === "USD" ? "دولار" : "دينار"}
              </button>
            ))}
          </div>
        </div>
      </header>

      <section style={S.board}>
        <Stat label="قيمة المحفظة" value={M(total)} tone="#EAF3EC" />
        <Stat label="الربح / الخسارة" value={(totalPL>=0?"+":"−")+M(Math.abs(totalPL))}
              sub={basis>0 ? (totalPL>=0?"+":"−")+pct(Math.abs(totalPL/basis)) : "—"}
              tone={totalPL>=0?"#37C793":"#E4574C"} />
        <Stat label="إجمالي التكلفة" value={M(basis)} tone="#8CA396" />
        <Stat label="السيولة الجاهزة" value={M(cash)} tone="#E5B143"
              sub={total > 0 ? pct(cash / total) + " من المحفظة" : "—"} />
        <div style={S.statCard}>
          <div style={S.label}>اكتمال إعادة التوازن</div>
          <div style={{ ...S.statVal, color:"#EAF3EC" }}>{Math.round(progress*100)}%</div>
          <div style={S.track}><div style={{ ...S.fill, width:`${progress*100}%` }} /></div>
        </div>
      </section>

      {msg && (
        <div style={{ maxWidth:1180, margin:"12px auto 0", padding:"0 16px" }}>
          <div style={{ ...S.msgBox,
            borderColor: msg.ok ? "rgba(55,199,147,0.3)" : "rgba(229,177,67,0.3)",
            color:       msg.ok ? "#37C793" : "#E5B143",
            background:  msg.ok ? "rgba(55,199,147,0.06)" : "rgba(229,177,67,0.06)" }}>
            {msg.ok ? "✓ " : "⚠ "}{msg.text}
          </div>
        </div>
      )}

      <nav style={S.tabs}>
        {TABS.map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)} style={{ ...S.tab, ...(tab===k?S.tabOn:{}) }}>{l}</button>
        ))}
      </nav>

      <main style={{ padding:"0 16px 70px", maxWidth:1180, margin:"0 auto" }}>
        {tab==="pitch"    && <Pitch byLine={byLine} M={M} frozen={frozen} />}
        {tab==="squad"    && <Squad rows={rows} byLine={byLine} M={M} frozen={frozen}
                                    onEdit={setEditing} onFreeze={toggleFreeze}
                                    onAdd={() => setEditing({ id:uid(), line:"mid", name:"", ticker:"", qty:0, cost:0, price:0, _new:true })}
                                    onClear={() => setClearing(true)}
                                    cash={cash} setCash={setCash} rate={rate} setRate={setRate}
                                    totalBasis={basis} totalValue={invested} />}
        {tab==="analysis" && <Analysis rows={rows} byLine={byLine} M={M} biggest={biggest} conc={conc}
                                       totalPL={totalPL} basis={basis} invested={invested} />}
        {tab==="livetab"  && <Live rows={rows} live={live} setLive={setLive} returns={returns} setReturns={setReturns} yields={yields} setYields={setYields} />}
        {tab==="future"   && <Future rows={rows} byLine={byLine} total={total} M={M}
                                     returns={returns} setReturns={setReturns} monthly={monthly} setMonthly={setMonthly}
                                     yields={yields} setYields={setYields} reinvest={reinvest} setReinvest={setReinvest} />}
        {tab==="risk"     && <RiskPanel rows={rows} byLine={byLine} total={total} M={M} frozen={frozen} live={live} />}
        {tab==="plan"     && <Planner byLine={byLine} cash={cash} M={M} frozen={frozen} cur={cur} rate={rate} />}
      </main>

      {editing && <Editor h={editing} onSave={saveHolding} onCancel={() => setEditing(null)} onDelete={removeHolding} />}
      {setup && <Setup url={sheetUrl} setUrl={setSheetUrl} onClose={() => setSetup(false)} />}
      {clearing && (
        <ConfirmClear
          onCancel={() => setClearing(false)}
          onConfirm={() => {
            setHoldings(SEED.map(h => ({ ...h, qty: 0, cost: 0 })));
            setCash(0);
            setClearing(false);
            flash(true, "تم التصفير — أدخل كمياتك ومتوسطك من زر تعديل");
          }}
        />
      )}

      <footer style={S.footer}>البيانات محفوظة على جهازك · أداة متابعة شخصية وليست نصيحة استثمارية</footer>
    </div>
  );
}

/* ═══════════════ الإعداد ═══════════════ */

          اختر تبويب <b style={{color:"#EAF3EC"}}>Portfolio</b>، وحدد الصيغة
          <b style={{color:"#EAF3EC"}}> Comma-separated values (.csv)</b>، ثم اضغط Publish وانسخ الرابط والصقه هنا.

        <div style={S.mHead}>
          <h3 style={S.mTitle}>البدء من الصفر</h3>

          <div style={{ marginTop:10, color:"#8CA396", fontSize:12.5 }}>

          </div>

/* ═══════════════ التشكيلة ═══════════════ */
function Pitch({ byLine, M, frozen }) {
  return (
    <div style={S.card}>
      <Head title="التشكيلة على أرض الملعب" note="حجم اللاعب يعكس وزنه · العلامة البيضاء هي الهدف" />
      {ORDER.slice().reverse().map(k => {
        const L = LINES[k], d = byLine[k];
        const max = Math.max(...d.list.map(x => x.value), 1);
        return (
          <div key={k} style={S.row}>
            <div style={S.rowMeta}>
              <span style={{ ...S.badge, background:L.color }}>{L.short}</span>
              <span style={S.weight}>{pct(d.weight)}</span>
              <span style={S.dimSm}>الهدف {pct(L.target)}</span>
            </div>
            <div style={S.players}>
              {!d.list.length && <div style={S.empty}>لا يوجد لاعبون</div>}
              {d.list.map(h => {
                const size = 42 + (h.value / max) * 44;
                const fz = frozen.includes(h.id);
                return (
                  <div key={h.id} style={S.player}>
                    <div style={{ ...S.jersey, width:size, height:size, borderColor:L.color, background:L.soft, opacity:fz?0.5:1 }}>
                      <span style={{ ...S.jTicker, fontSize:size>68?11:9 }}>{h.ticker.slice(0,9)}</span>
                      {fz && <span style={S.snow}>❄</span>}
                    </div>
                    <div style={S.pVal}>{M(h.value)}</div>
                    <div style={S.pName}>{h.name}</div>
                  </div>
                );
              })}
            </div>
            <div style={S.barTrack}>
              <div style={{ ...S.barFill, width:`${Math.min(d.weight/0.9,1)*100}%`, background:L.color }} />
              <div style={{ ...S.barMark, insetInlineStart:`${Math.min(L.target/0.9,1)*100}%` }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════ المراكز ═══════════════ */
function Squad({ rows, byLine, M, frozen, onEdit, onFreeze, onAdd, onClear, cash, setCash, rate, setRate, totalBasis, totalValue }) {
  return (
    <React.Fragment>
      <div style={{ ...S.card, marginBottom:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12 }}>
          <Head title="إدارة المراكز" note="حدّث الكميات والمتوسط بعد كل شراء" flush />
          <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
            <button onClick={onAdd} style={S.primary}>+ ضم لاعب</button>
            <button onClick={onClear} style={S.resetBtn}>ابدأ من الصفر</button>
          </div>
        </div>
        <div style={S.costBar}>
          <div style={S.costItem}>
            <div style={S.label}>إجمالي تكلفة المحفظة</div>
            <div style={{ fontFamily:MONO, fontSize:17, fontWeight:600, color:"#A8BFB0", marginTop:4 }}>{M(totalBasis)}</div>
          </div>
          <div style={S.costItem}>
            <div style={S.label}>القيمة السوقية</div>
            <div style={{ fontFamily:MONO, fontSize:17, fontWeight:600, color:"#EAF3EC", marginTop:4 }}>{M(totalValue)}</div>
          </div>
          <div style={S.costItem}>
            <div style={S.label}>الفرق</div>
            <div style={{ fontFamily:MONO, fontSize:17, fontWeight:600, marginTop:4,
                          color: totalValue - totalBasis >= 0 ? "#37C793" : "#E4574C" }}>
              {(totalValue - totalBasis >= 0 ? "+" : "−") + M(Math.abs(totalValue - totalBasis))}
            </div>
          </div>
        </div>
      </div>

      {ORDER.map(k => {
        const L = LINES[k], d = byLine[k];
        return (
          <div key={k} style={{ ...S.card, marginBottom:14, borderInlineStartColor:L.color }}>
            <div style={S.sHead}>
              <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
                <span style={{ ...S.badge, background:L.color }}>{L.name}</span>
                <span style={S.weightSm}>{pct(d.weight)} <span style={S.dim}>من {pct(L.target)}</span></span>
              </div>
              <div style={{ textAlign:"left" }}>
                <div style={S.mono16}>{M(d.value)}</div>
                <div style={{ ...S.dim, fontSize:11.5, fontFamily:MONO, marginTop:2 }}>
                  التكلفة {M(d.basis)}
                </div>
              </div>
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={S.table}>
                <thead><tr>{["اللاعب","الكمية","متوسط التكلفة","إجمالي التكلفة","السعر الحالي","القيمة السوقية","الربح/الخسارة",""].map(h => <th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {d.list.map(h => {
                    const fz = frozen.includes(h.id);
                    return (
                      <tr key={h.id} style={{ opacity:fz?0.58:1 }}>
                        <td style={S.td}>
                          <div style={{ fontWeight:600, color:"#EAF3EC" }}>{h.name}</div>
                          <div style={S.tag}>{h.ticker}{fz && " · مجمّد"}</div>
                        </td>
                        <td style={S.tdN}>{h.qty.toLocaleString("en-US",{maximumFractionDigits:2})}</td>
                        <td style={S.tdN}>{h.cost.toFixed(2)}</td>
                        <td style={{ ...S.tdN, color:"#8CA396" }}>{M(h.basis)}</td>
                        <td style={S.tdN}>{h.price.toFixed(2)}</td>
                        <td style={{ ...S.tdN, color:"#EAF3EC", fontWeight:600 }}>{M(h.value)}</td>
                        <td style={{ ...S.tdN, color:h.pl>=0?"#37C793":"#E4574C", fontWeight:600 }}>
                          {(h.pl>=0?"+":"−")+M(Math.abs(h.pl))}
                          <div style={{ fontSize:11, opacity:0.72 }}>{(h.pl>=0?"+":"−")+pct(Math.abs(h.plPct))}</div>
                        </td>
                        <td style={{ ...S.td, whiteSpace:"nowrap" }}>
                          <button onClick={() => onEdit(h)} style={S.icon}>تعديل</button>
                          <button onClick={() => onFreeze(h.id)} style={{ ...S.icon, color:fz?"#5EC8FF":"#6E8A7C" }}>{fz?"تشغيل":"تجميد"}</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })}

      <div style={S.card}>
        <Head title="إعدادات" note="السيولة النقدية وسعر صرف الدينار" />
        <div style={S.fields}>
          <Field label="السيولة النقدية (دولار)" value={cash} onChange={v => setCash(num(parseFloat(v)))} />
          <Field label="سعر صرف الدينار" value={rate} step="0.0001" onChange={v => setRate(num(parseFloat(v))||1)} />
        </div>
      </div>
    </React.Fragment>
  );
}

/* ═══════════════ التحليل ═══════════════ */
function Analysis({ rows, byLine, M, biggest, conc, totalPL, basis, invested }) {
  const sorted = [...rows].sort((a,b) => b.pl - a.pl);
  const win  = sorted.filter(r => r.pl > 0).slice(0,3);
  const lose = sorted.filter(r => r.pl < 0).slice(-3).reverse();
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.pl)), 1);

  return (
    <React.Fragment>
      {conc > RISK.conc && (
        <div style={S.alert}>
          <div style={{ fontSize:18, color:"#E5B143" }}>⚠</div>
          <div>
            <div style={S.alertT}>تركّز عالٍ في مركز واحد</div>
            <div style={S.alertB}>
              سهم <b style={{color:"#EAF3EC"}}>{biggest.name}</b> يشكّل وحده {pct(conc)} من إجمالي المحفظة —
              أي أن هذي النسبة من أدائك مرتبطة بشركة واحدة.
            </div>
          </div>
        </div>
      )}

      <div style={S.card}>
        <Head title="الوزن الحالي مقابل الهدف" note="الفجوة تُظهر ما يحتاجه كل خط" />
        {ORDER.map(k => {
          const L = LINES[k], d = byLine[k], over = d.weight > L.target;
          return (
            <div key={k} style={S.gapRow}>
              <div style={S.gapName}><span style={{ ...S.dot, background:L.color }} />{L.name}</div>
              <div style={{ flex:1, minWidth:110 }}>
                <div style={S.barTrack}>
                  <div style={{ ...S.barFill, width:`${Math.min(d.weight/0.9,1)*100}%`, background:L.color }} />
                  <div style={{ ...S.barMark, insetInlineStart:`${Math.min(L.target/0.9,1)*100}%` }} />
                </div>
              </div>
              <div style={S.gapN}><b style={{color:"#EAF3EC"}}>{pct(d.weight)}</b><span style={S.dim}> / {pct(L.target)}</span></div>
              <div style={{ ...S.gapA, color:over?"#E4574C":"#37C793" }}>
                {over ? `فائض ${M(Math.abs(d.gap))}` : `يحتاج ${M(Math.abs(d.gap))}`}
              </div>
            </div>
          );
        })}
      </div>

      <div style={S.grid2}>
        <div style={S.card}>
          <Head title="أفضل ثلاثة" />
          {win.map(r => <PLRow key={r.id} r={r} max={maxAbs} M={M} />)}
          {!win.length && <div style={S.empty}>لا توجد مراكز رابحة</div>}
        </div>
        <div style={S.card}>
          <Head title="أضعف ثلاثة" />
          {lose.map(r => <PLRow key={r.id} r={r} max={maxAbs} M={M} />)}
          {!lose.length && <div style={S.empty}>لا توجد مراكز خاسرة</div>}
        </div>
      </div>

      <div style={S.card}>
        <Head title="ملخص الأداء" />
        <div style={S.sumGrid}>
          <Sum label="رأس المال المستثمر" value={M(basis)} />
          <Sum label="القيمة السوقية" value={M(invested)} />
          <Sum label="صافي الربح/الخسارة" value={(totalPL>=0?"+":"−")+M(Math.abs(totalPL))} tone={totalPL>=0?"#37C793":"#E4574C"} />
          <Sum label="العائد على التكلفة" value={basis>0?(totalPL>=0?"+":"−")+pct(Math.abs(totalPL/basis)):"—"} tone={totalPL>=0?"#37C793":"#E4574C"} />
          <Sum label="عدد المراكز" value={rows.filter(r => r.qty > 0).length} />
          <Sum label="أكبر مركز" value={biggest ? `${biggest.ticker} · ${pct(conc)}` : "—"} />
        </div>
      </div>
    </React.Fragment>
  );
}

function PLRow({ r, max, M }) {
  const up = r.pl >= 0;
  return (
    <div style={{ display:"flex", alignItems:"center", gap:12, padding:"9px 0" }}>
      <div style={{ minWidth:92 }}>
        <div style={{ color:"#EAF3EC", fontWeight:600, fontSize:12.5 }}>{r.ticker}</div>
        <div style={{ ...S.dim, fontSize:11 }}>{LINES[r.line].short}</div>
      </div>
      <div style={{ flex:1, height:6, background:"rgba(255,255,255,0.055)", borderRadius:4, overflow:"hidden" }}>
        <div style={{ height:"100%", width:`${(Math.abs(r.pl)/max)*100}%`, background:up?"#37C793":"#E4574C" }} />
      </div>
      <div style={{ fontFamily:MONO, fontSize:12.5, color:up?"#37C793":"#E4574C", fontWeight:600, minWidth:88, textAlign:"left" }}>
        {(up?"+":"−")+M(Math.abs(r.pl))}
      </div>
    </div>
  );
}

function Sum({ label, value, tone = "#EAF3EC" }) {
  return (
    <div style={{ background:"rgba(0,0,0,0.18)", borderRadius:10, padding:"12px 14px" }}>
      <div style={S.label}>{label}</div>
      <div style={{ fontFamily:MONO, fontSize:16.5, fontWeight:600, color:tone, marginTop:4 }}>{value}</div>
    </div>
  );
}

/* ═══════════════ التحليل الحي ═══════════════ */
function Live({ rows, live, setLive, returns, setReturns, yields, setYields }) {
  const [busy, setBusy] = useState(false);
  const [step, setStep] = useState("");
  const [err, setErr]   = useState("");

  const run = async () => {
    setBusy(true); setErr("");
    const result = { at: new Date().toISOString(), lines:{}, holdings:{}, macro:null };
    const bad = [];
    let lastError = null;

    setStep("أبحث عن حالة الأسواق…");
    try {
      result.macro = await ask(
`ابحث في الويب عن آخر أخبار الأسواق المالية اليوم: الأسواق الأمريكية، بورصة الكويت، سوق أبوظبي، الذهب، والبيتكوين.
أرجع JSON فقط بدون نص إضافي:
{"summary":"٣ أسطر بالعربية عن حالة الأسواق الآن","themes":["عامل ١","عامل ٢","عامل ٣"],"sources":["مصدر ١","مصدر ٢"]}`);
    } catch(e){ bad.push("نظرة السوق"); lastError = e.message; }

    for (const k of ORDER) {
      const list = rows.filter(r => r.line === k && r.qty > 0);
      if (!list.length) continue;
      setStep(`أحلل ${LINES[k].name}…`);
      const names = list.map(r => `${r.name} (${r.ticker})`).join("، ");
      try {
        const out = await ask(
`ابحث في الويب عن آخر الأخبار وتقارير المحللين لهذه الأسهم: ${names}.
السياق: أسهم ضمن خط "${LINES[k].name}"، ودوره: ${LINE_ROLE[k]}. المستثمر يلتزم بالأسهم المتوافقة مع الضوابط الشرعية.
أرجع JSON فقط بدون نص إضافي، بالعربية وبإيجاز:
{"expectedReturn": نمو السعر السنوي المتوقع لهذا الخط كنسبة مئوية بدون التوزيعات,
"dividendYield": متوسط عائد التوزيعات السنوي لهذا الخط كنسبة مئوية، وصفر إن لم توجد,
"rationale":"سطر يشرح أساس الرقم",
"holdings":[{"ticker":"الرمز","outlook":"سطر","risk":"high|medium|low","dividend": عائد توزيعات هذا السهم كنسبة مئوية أو صفر,"catalyst":"تطور حديث","concern":"أبرز مخاطرة"}],
"sources":["مصدر"]}`);
        result.lines[k] = out;
        (out.holdings||[]).forEach(h => { if (h?.ticker) result.holdings[h.ticker] = h; });
      } catch(e){ bad.push(LINES[k].name); lastError = e.message; }
      await sleep(400);
    }

    if (result.macro || Object.keys(result.lines).length) {
      setLive(result);
      if (bad.length) setErr(`اكتمل جزئيًا. تعذّر: ${bad.join("، ")}`);
    } else {
      setErr("تعذّر إتمام التحليل" + (lastError ? ": " + lastError : "") +
             " — افتح /api/analyze في المتصفح لفحص حالة المفتاح.");
    }
    setStep(""); setBusy(false);
  };

  const applyReturns = () => {
    const nextR = { ...returns };
    const nextY = { ...yields };
    ORDER.forEach(k => {
      const r = live?.lines?.[k]?.expectedReturn;
      if (typeof r === "number" && r > -50 && r < 100) nextR[k] = r/100;
      const d = live?.lines?.[k]?.dividendYield;
      if (typeof d === "number" && d >= 0 && d < 30) nextY[k] = d/100;
    });
    setReturns(nextR);
    setYields(nextY);
  };

  const hasRates = live && ORDER.some(k => typeof live.lines?.[k]?.expectedReturn === "number");

  return (
    <React.Fragment>
      <div style={S.card}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:14, flexWrap:"wrap" }}>
          <Head title="التحليل الحي من السوق" note="يبحث في الويب عن آخر الأخبار والتحليلات" flush />
          <button onClick={run} disabled={busy} style={{ ...S.liveBtn, opacity:busy?0.55:1 }}>
            {busy ? "جاري التحليل…" : live ? "↻ تحديث" : "▶ ابدأ التحليل"}
          </button>
        </div>
        {busy && (
          <div style={S.progress}>
            <div style={S.spinner} />
            <div>
              <div style={{ color:"#EAF3EC", fontSize:13 }}>{step}</div>
              <div style={{ ...S.dim, fontSize:11.5, marginTop:3 }}>يستغرق دقيقة إلى دقيقتين</div>
            </div>
          </div>
        )}
        {err && <div style={S.err}>{err}</div>}
        {live && !busy && (
          <div style={{ ...S.dim, fontSize:11.5, marginTop:14 }}>
            آخر تحليل: {new Date(live.at).toLocaleString("ar",{dateStyle:"medium",timeStyle:"short"})}
          </div>
        )}
      </div>

      {!live && !busy && (
        <div style={{ ...S.card, textAlign:"center", padding:44 }}>
          <div style={{ fontSize:30, marginBottom:12 }}>📡</div>
          <div style={{ fontFamily:DISPLAY, fontSize:16, fontWeight:700, color:"#EAF3EC", marginBottom:8 }}>ما فيه تحليل بعد</div>
          <div style={{ ...S.dim, fontSize:12.5, lineHeight:1.9, maxWidth:440, margin:"0 auto" }}>
            اضغط «ابدأ التحليل» ليبحث عن آخر أخبار وتقارير المحللين لكل سهم، ويستخرج العائد المتوقع لكل خط من معطيات السوق.
          </div>
        </div>
      )}

      {live?.macro && (
        <div style={S.card}>
          <Head title="حالة الأسواق الآن" />
          <div style={{ fontSize:13.5, color:"#C9DACF", lineHeight:2 }}>{live.macro.summary}</div>
          {live.macro.themes?.length > 0 && (
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:14 }}>
              {live.macro.themes.map((t,i) => <span key={i} style={S.themeChip}>{t}</span>)}
            </div>
          )}
          {live.macro.sources?.length > 0 &&
            <div style={{ ...S.dim, fontSize:11, marginTop:14 }}>المصادر: {live.macro.sources.join(" · ")}</div>}
        </div>
      )}

      {hasRates && (
        <div style={{ ...S.card, borderInlineStartColor:"#37C793" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:14, flexWrap:"wrap" }}>
            <Head title="العوائد المتوقعة من السوق" note="نمو السعر والتوزيعات — مستخرجة من تقارير المحللين" flush />
            <button onClick={applyReturns} style={S.primary}>تطبيقها على التوقعات</button>
          </div>
          <div style={{ ...S.retGrid, marginTop:18, marginBottom:0 }}>
            {ORDER.map(k => {
              const d = live.lines?.[k]; if (!d) return null;
              return (
                <div key={k} style={{ ...S.retCard, borderInlineStartColor:LINES[k].color }}>
                  <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:8 }}>
                    <span style={{ ...S.dot, background:LINES[k].color }} />
                    <span style={{ fontSize:12.5, color:"#C9DACF" }}>{LINES[k].name}</span>
                  </div>
                  <div style={{ display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
                    <div>
                      <div style={{ fontFamily:MONO, fontSize:23, fontWeight:600, color:"#EAF3EC" }}>
                        {typeof d.expectedReturn === "number" ? d.expectedReturn.toFixed(1)+"٪" : "—"}
                      </div>
                      <div style={{ ...S.dim, fontSize:10 }}>نمو السعر</div>
                    </div>
                    {typeof d.dividendYield === "number" && d.dividendYield > 0 && (
                      <div>
                        <div style={{ fontFamily:MONO, fontSize:17, fontWeight:600, color:"#5EC8FF" }}>
                          +{d.dividendYield.toFixed(1)}٪
                        </div>
                        <div style={{ ...S.dim, fontSize:10 }}>توزيعات</div>
                      </div>
                    )}
                  </div>
                  {typeof d.expectedReturn === "number" && typeof d.dividendYield === "number" && d.dividendYield > 0 && (
                    <div style={{ fontFamily:MONO, fontSize:12, color:"#37C793", marginTop:6 }}>
                      الإجمالي {(d.expectedReturn + d.dividendYield).toFixed(1)}٪
                    </div>
                  )}
                  {d.rationale && <div style={{ ...S.dim, fontSize:11, marginTop:7, lineHeight:1.75 }}>{d.rationale}</div>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {live && ORDER.map(k => {
        const d = live.lines?.[k];
        if (!d?.holdings?.length) return null;
        return (
          <div key={k} style={{ ...S.card, borderInlineStartColor:LINES[k].color }}>
            <div style={{ marginBottom:16 }}><span style={{ ...S.badge, background:LINES[k].color }}>{LINES[k].name}</span></div>
            {d.holdings.map((h,i) => {
              const rc = h.risk==="high"?"#E4574C":h.risk==="medium"?"#E5B143":"#37C793";
              const rl = h.risk==="high"?"مخاطرة عالية":h.risk==="medium"?"مخاطرة متوسطة":"مخاطرة منخفضة";
              const match = rows.find(r => r.ticker === h.ticker);
              return (
                <div key={i} style={S.liveItem}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:9 }}>
                    <span style={{ fontWeight:700, color:"#EAF3EC", fontSize:14 }}>{match?.name || h.ticker}</span>
                    <span style={S.tag}>{h.ticker}</span>
                    <span style={{ ...S.sevTag, background:rc+"1A", color:rc, borderColor:rc+"50" }}>{rl}</span>
                  </div>
                  {h.outlook && <div style={{ fontSize:12.8, color:"#C9DACF", lineHeight:1.9, marginBottom:10 }}>{h.outlook}</div>}
                  <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10 }}>
                    {h.catalyst && (
                      <div style={{ ...S.planBox, borderInlineStart:"2px solid #37C793" }}>
                        <div style={{ fontSize:10.5, color:"#37C793", marginBottom:4 }}>تطوّر حديث</div>
                        <div style={{ fontSize:12, color:"#A8BFB0", lineHeight:1.8 }}>{h.catalyst}</div>
                      </div>
                    )}
                    {h.concern && (
                      <div style={{ ...S.planBox, borderInlineStart:"2px solid #E4574C" }}>
                        <div style={{ fontSize:10.5, color:"#E4574C", marginBottom:4 }}>أبرز مخاطرة</div>
                        <div style={{ fontSize:12, color:"#A8BFB0", lineHeight:1.8 }}>{h.concern}</div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
            {d.sources?.length > 0 && <div style={{ ...S.dim, fontSize:11, marginTop:12 }}>المصادر: {d.sources.join(" · ")}</div>}
          </div>
        );
      })}

      {live && (
        <div style={S.disc}>
          <b style={{ color:"#E5B143" }}>قبل ما تبني قرارًا على هذا</b>
          <div style={{ marginTop:8 }}>
            تحليل مُجمَّع من مصادر عامة — قد يحتوي أخطاء أو معلومات متأخرة، وقد تتناقض المصادر.
            راجعها بنفسك، وتأكد من التوافق الشرعي من مرجعك المعتمد لأن التصنيفات تتغير.
            العوائد المتوقعة تقديرات محللين وليست وعودًا، والقرار قرارك.
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

/* ═══════════════ المستقبل ═══════════════ */
function Future({ rows, byLine, total, M, returns, setReturns, monthly, setMonthly, yields, setYields, reinvest, setReinvest }) {
  const [scen, setScen] = useState("base");
  const mult = SCENARIOS[scen].mult;

  // الحساب على نسب الخطة الدائمة — إعادة التوازن مرحلة عابرة لا تؤثر على المدى الطويل
  const proj = useMemo(() => HORIZONS.map(y => {
    const lines = {}; let sum = 0, divSum = 0;
    ORDER.forEach(k => {
      const r = fvWithYield(byLine[k].value, returns[k]*mult, yields[k], y, monthly*NORMAL[k], reinvest);
      lines[k] = r.total; sum += r.total; divSum += r.divs;
    });
    return { years:y, lines, total:sum, divs:divSum, invested: total + monthly*12*y };
  }), [byLine, returns, yields, reinvest, mult, monthly, total]);

  // الدخل السنوي من التوزيعات بالوضع الحالي
  const annualIncome = ORDER.reduce((s,k) => s + byLine[k].value * yields[k], 0);

  const maxT = Math.max(...proj.map(p => p.total), 1);

  return (
    <React.Fragment>
      <div style={S.card}>
        <Head title="افتراضات النمو" note="عدّلها يدويًا أو اسحبها من السوق عبر تبويب «تحليل حي»" />
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:18 }}>
          {Object.entries(SCENARIOS).map(([k,s]) => (
            <button key={k} onClick={() => setScen(k)}
              style={{ ...S.scenBtn, ...(scen===k?{background:s.color,color:"#08130E",borderColor:s.color,fontWeight:700}:{}) }}>
              {s.name}
            </button>
          ))}
        </div>
        <div style={S.retGrid}>
          {ORDER.map(k => (
            <div key={k} style={{ ...S.retCard, borderInlineStartColor:LINES[k].color }}>
              <div style={{ display:"flex", alignItems:"center", gap:7, marginBottom:7 }}>
                <span style={{ ...S.dot, background:LINES[k].color }} />
                <span style={{ fontSize:12.5, color:"#C9DACF" }}>{LINES[k].name}</span>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <input type="number" step="0.5" value={(returns[k]*100).toFixed(1)}
                  onChange={e => setReturns({ ...returns, [k]:(parseFloat(e.target.value)||0)/100 })}
                  style={{ ...S.input, marginTop:0, width:80, textAlign:"center" }} />
                <span style={S.dim}>٪ سنويًا</span>
              </div>
              <div style={{ ...S.dim, fontSize:11, marginTop:6 }}>
                نمو فعلي: {((returns[k]*mult)*100).toFixed(1)}٪
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:9, paddingTop:9, borderTop:"1px solid rgba(255,255,255,0.06)" }}>
                <input type="number" step="0.1" value={(yields[k]*100).toFixed(1)}
                  onChange={e => setYields({ ...yields, [k]:(parseFloat(e.target.value)||0)/100 })}
                  style={{ ...S.input, marginTop:0, width:72, textAlign:"center", fontSize:13 }} />
                <span style={{ ...S.dim, fontSize:11 }}>٪ توزيعات</span>
              </div>
            </div>
          ))}
        </div>
        <div style={S.fields}>
          <Field label="الاستثمار الشهري (دولار)" value={monthly} onChange={v => setMonthly(num(parseFloat(v)))} />
        </div>

        <div style={S.phaseBox}>
          <div style={{ fontSize:11.5, color:"#37C793", marginBottom:7, fontWeight:600 }}>
            توزيع الاستثمار الشهري حسب الخطة
          </div>
          <div style={{ ...S.dim, fontSize:12.5, lineHeight:1.9, fontFamily:MONO }}>
            {ORDER.map(k => `${LINES[k].short} ${(NORMAL[k]*100).toFixed(0)}٪`).join("  ·  ")}
          </div>
          <div style={{ ...S.dim, fontSize:11, marginTop:7, lineHeight:1.8 }}>
            إعادة التوازن مرحلة عابرة لبضعة أشهر، ولا تُحتسب هنا لأن أثرها على المدى الطويل ضئيل.
            توزيع فترة إعادة التوازن تجده في تبويب «خطة الشراء».
          </div>
        </div>

        <div style={S.divBox}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:14, flexWrap:"wrap" }}>
            <div>
              <div style={{ fontSize:12.5, color:"#C9DACF", fontWeight:600 }}>التوزيعات النقدية</div>
              <div style={{ ...S.dim, fontSize:11.5, marginTop:4 }}>
                الدخل المتوقع من محفظتك الحالية: <b style={{ color:"#37C793", fontFamily:MONO }}>{M(annualIncome)}</b> سنويًا
              </div>
            </div>
            <div style={S.segment}>
              <button onClick={() => setReinvest(true)}  style={{ ...S.segBtn, ...(reinvest?S.segOn:{}) }}>إعادة استثمار</button>
              <button onClick={() => setReinvest(false)} style={{ ...S.segBtn, ...(!reinvest?S.segOn:{}) }}>سحب نقدي</button>
            </div>
          </div>
          <div style={{ ...S.dim, fontSize:11.5, marginTop:10, lineHeight:1.8 }}>
            {reinvest
              ? "التوزيعات تُعاد لشراء مزيد من الأسهم فتنمو مع المحفظة — أثرها التراكمي كبير على المدى الطويل."
              : "التوزيعات تُسحب نقدًا ولا تنمو — تُضاف للإجمالي كمبلغ متراكم فقط."}
          </div>
        </div>
      </div>

      <div style={S.card}>
        <Head title="إلى أين تتجه المحفظة" note="رأس المال الحالي مضافًا له الاستثمار الشهري" />
        {proj.map(p => {
          const gain = p.total - p.invested;
          return (
            <div key={p.years} style={S.projRow}>
              <div style={{ minWidth:50, textAlign:"center" }}>
                <div style={{ fontFamily:MONO, fontSize:21, fontWeight:600, color:"#EAF3EC" }}>{p.years}</div>
                <div style={{ ...S.dim, fontSize:10.5 }}>سنوات</div>
              </div>
              <div style={{ flex:1, minWidth:130 }}>
                <div style={{ height:22, background:"rgba(255,255,255,0.05)", borderRadius:6, overflow:"hidden", display:"flex" }}>
                  <div style={{ width:`${(p.invested/maxT)*100}%`, background:"rgba(140,163,150,0.45)" }} />
                  <div style={{ width:`${(Math.max(0,gain - p.divs)/maxT)*100}%`, background:SCENARIOS[scen].color }} />
                  <div style={{ width:`${(Math.max(0,p.divs)/maxT)*100}%`, background:"#5EC8FF" }} />
                </div>
                <div style={{ display:"flex", gap:12, marginTop:6, fontSize:10.5, color:"#6E8A7C", flexWrap:"wrap" }}>
                  <span>■ رأس المال {M(p.invested)}</span>
                  <span style={{ color:SCENARIOS[scen].color }}>■ نمو {M(Math.max(0, gain - p.divs))}</span>
                  {p.divs > 0 && <span style={{ color:"#5EC8FF" }}>■ توزيعات {M(p.divs)}</span>}
                </div>
              </div>
              <div style={{ textAlign:"left", minWidth:115 }}>
                <div style={{ fontFamily:MONO, fontSize:17, fontWeight:600, color:"#EAF3EC" }}>{M(p.total)}</div>
                <div style={{ fontFamily:MONO, fontSize:11, color:"#37C793" }}>×{(p.total/Math.max(total,1)).toFixed(1)} من اليوم</div>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ ...S.card, marginBottom:14 }}>
        <Head title="التفصيل حسب الخط" note="نمو كل خط على حدة عبر السنوات" flush />
      </div>

      {ORDER.map(k => {
        const L = LINES[k];
        return (
          <div key={k} style={{ ...S.card, marginBottom:14, borderInlineStartColor:L.color, background:L.soft }}>

/* ═══════════════ الإنذار ═══════════════ */
function RiskPanel({ rows, byLine, total, M, frozen, live }) {
  const alerts = useMemo(() => {
    const list = [];

    rows.filter(r => r.value > 0).forEach(r => {
      const h = live?.holdings?.[r.ticker];
      if (h?.risk === "high") list.push({
        sev:"high", ticker:r.ticker, live:true,
        title:"مخاطرة عالية في آخر تحليل من السوق",
        fact: h.concern || h.outlook || "رُصدت مخاطرة مرتفعة.",
        plan: h.catalyst ? `آخر تطوّر: ${h.catalyst}` : "افتح تبويب «تحليل حي» للتفاصيل والمصادر.",
      });
    });

    rows.filter(r => r.value > 0).forEach(r => {
      const w = total > 0 ? r.value/total : 0;
      const L = LINES[r.line];

      if (w > RISK.conc) list.push({
        sev:"high", ticker:r.ticker,
        title:"تركّز مرتفع في مركز واحد",
        fact:`يشكّل ${pct(w)} من إجمالي المحفظة.`,
        plan: frozen.includes(r.id)
          ? "خطتك تعالج التركّز بتجميد الضخ لا بالبيع — وهذا مطبّق حاليًا."
          : "خطتك تعالج التركّز بتجميد الضخ لا بالبيع. فكّر في تجميده من تبويب المراكز.",
      });

      if (r.plPct <= -RISK.deep) list.push({
        sev:"high", ticker:r.ticker,
        title:"خسارة غير محققة عميقة",
        fact:`أقل من متوسط تكلفتك بـ ${pct(Math.abs(r.plPct))} — بفارق ${M(Math.abs(r.pl))}.`,
        plan:`الأسئلة التي تحدد الإجابة: هل تغيّرت أساسيات الشركة أم أن السوق كله نزل؟ ولو لم تكن تملكه اليوم، هل كنت ستشتريه بهذا السعر؟ دور خط ${L.short} في خطتك: ${LINE_ROLE[r.line].split("الدور:")[1] || ""}`,
      });
      else if (r.plPct <= -RISK.watch) list.push({
        sev:"mid", ticker:r.ticker,
        title:"تحت المراقبة",
        fact:`أقل من تكلفتك بـ ${pct(Math.abs(r.plPct))} (${M(Math.abs(r.pl))}).`,
        plan:"ضمن نطاق التقلب الطبيعي، لكن يستحق متابعة أسباب الانخفاض.",
      });
    });

    ORDER.forEach(k => {
      const d = byLine[k], L = LINES[k], dev = d.weight - L.target;
      if (Math.abs(dev) > RISK.drift) list.push({
        sev: Math.abs(dev) > 0.25 ? "high" : "mid",
        title:`انحراف ${L.name} عن هدفه`,
        fact:`الوزن الحالي ${pct(d.weight)} مقابل هدف ${pct(L.target)}.`,
        plan: dev > 0
          ? `الخط متضخم بمقدار ${M(Math.abs(d.gap))}. خطتك تعالجه بتجميد الضخ وتوجيه السيولة للخطوط الناقصة، لا بالبيع.`
          : `الخط ناقص بمقدار ${M(Math.abs(d.gap))}. خطة الشراء توجّه له حصة أكبر مؤقتًا.`,
      });
    });

    return list.sort((a,b) => (a.sev==="high"?0:1) - (b.sev==="high"?0:1));
  }, [rows, byLine, total, frozen, live, M]);

  const high = alerts.filter(a => a.sev==="high").length;
  const mid  = alerts.filter(a => a.sev==="mid").length;

  return (
    <React.Fragment>
      <div style={S.card}>
        <Head title="حالة الإنذار" note="مبني على بيانات محفظتك ونتائج التحليل الحي" />
        <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
          <div style={{ ...S.sevBox, borderColor: high?"rgba(228,87,76,0.35)":"rgba(255,255,255,0.08)" }}>
            <div style={{ fontFamily:MONO, fontSize:26, fontWeight:600, color: high?"#E4574C":"#4A6255" }}>{high}</div>
            <div style={S.label}>يحتاج انتباهك</div>
          </div>
          <div style={{ ...S.sevBox, borderColor: mid?"rgba(229,177,67,0.3)":"rgba(255,255,255,0.08)" }}>
            <div style={{ fontFamily:MONO, fontSize:26, fontWeight:600, color: mid?"#E5B143":"#4A6255" }}>{mid}</div>
            <div style={S.label}>تحت المراقبة</div>
          </div>
        </div>
      </div>

      {!alerts.length && (
        <div style={{ ...S.card, textAlign:"center", padding:40 }}>
          <div style={{ fontSize:30, marginBottom:10 }}>✓</div>
          <div style={{ color:"#37C793", fontFamily:DISPLAY, fontSize:16, fontWeight:700 }}>لا توجد تنبيهات</div>
        </div>
      )}

      {alerts.map((a,i) => {
        const c = a.sev==="high" ? "#E4574C" : "#E5B143";
        return (
          <div key={i} style={{ ...S.card, borderInlineStartColor:c, marginBottom:14 }}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:12 }}>
              <span style={{ ...S.sevTag, background:c+"1F", color:c, borderColor:c+"55" }}>{a.sev==="high"?"انتباه":"مراقبة"}</span>
              <span style={{ fontFamily:DISPLAY, fontSize:15, fontWeight:700, color:"#EAF3EC" }}>{a.title}</span>
              {a.ticker && <span style={S.tag}>{a.ticker}</span>}
              {a.live && <span style={S.liveTag}>● حي</span>}
            </div>
            <div style={{ fontSize:13, color:"#C9DACF", lineHeight:1.85, marginBottom:12 }}>{a.fact}</div>
            <div style={S.planBox}>
              <div style={{ fontSize:11, color:"#6E8A7C", marginBottom:5 }}>ماذا تقول خطتك</div>
              <div style={{ fontSize:12.5, color:"#A8BFB0", lineHeight:1.85 }}>{a.plan}</div>
            </div>
          </div>
        );
      })}
    </React.Fragment>
  );
}

/* ═══════════════ خطة الشراء ═══════════════ */
function Planner({ byLine, cash, M, frozen, cur, rate }) {
  const [amount, setAmount] = useState(cash);
  const [mode, setMode] = useState("rebal");
  const split = mode==="rebal" ? REBAL : NORMAL;

  return (
    <React.Fragment>
      <div style={S.card}>
        <Head title="موزّع السيولة" note="أدخل المبلغ ليُقسَّم على الخطوط والأسهم" />
        <div style={S.fields}>
          <Field label="المبلغ المتاح (دولار)" value={amount} onChange={v => setAmount(num(parseFloat(v)))} />
          <div style={{ display:"flex", flexDirection:"column", minWidth:190, flex:1 }}>
            <span style={S.label}>وضع التوزيع</span>
            <div style={{ ...S.segment, marginTop:6 }}>
              <button onClick={() => setMode("rebal")}  style={{ ...S.segBtn, ...(mode==="rebal"?S.segOn:{}) }}>إعادة توازن</button>
              <button onClick={() => setMode("normal")} style={{ ...S.segBtn, ...(mode==="normal"?S.segOn:{}) }}>نسب الخطة</button>
            </div>
          </div>
        </div>
        <div style={S.modeNote}>
          {mode==="rebal"
            ? "خط الدفاع مجمّد بالكامل، وحصته موزّعة على الحارس والوسط والهجوم لتسريع الوصول للنسب المستهدفة."
            : "النسب الأصلية: ١٠٪ حارس · ٤٠٪ دفاع · ٣٠٪ وسط · ٢٠٪ هجوم."}
          <div style={{ marginTop:8, paddingTop:8, borderTop:"1px solid rgba(255,255,255,0.07)" }}>
            داخل خط الحارس: الذهب ٧٠٪ وبيتك ريت ٣٠٪. باقي الخطوط تتوزع بالتساوي.
          </div>
        </div>
      </div>

      {ORDER.map(k => {
        const L = LINES[k];
        const alloc = amount * split[k];
        const active = byLine[k].list.filter(h => !frozen.includes(h.id));
        const custom = active.filter(h => INNER[h.ticker] != null);
        const rest   = active.filter(h => INNER[h.ticker] == null);
        const cSum   = custom.reduce((s,h) => s + INNER[h.ticker], 0);
        const left   = Math.max(0, 1 - cSum);
        const shareOf = (h) => INNER[h.ticker] != null
          ? (rest.length === 0 && cSum > 0 ? INNER[h.ticker]/cSum : INNER[h.ticker])
          : (rest.length ? left/rest.length : 0);

        return (
          <div key={k} style={{ ...S.card, marginBottom:14, borderInlineStartColor:L.color }}>
            <div style={S.sHead}>
              <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
                <span style={{ ...S.badge, background:L.color }}>{L.name}</span>
                <span style={S.dim}>{pct(split[k])} من المبلغ</span>
              </div>
              <div style={{ ...S.mono16, color: alloc>0?"#EAF3EC":"#4A6255" }}>{M(alloc)}</div>
            </div>
            {alloc === 0 ? (
              <div style={S.frozenNote}>مجمّد خلال فترة إعادة التوازن — لا شراء جديد</div>
            ) : !active.length ? (
              <div style={S.empty}>لا يوجد لاعبون نشطون</div>
            ) : (
              <div style={S.buyGrid}>
                {active.map(h => {
                  const sh = shareOf(h), amt = alloc * sh;
                  return (
                    <div key={h.id} style={S.chip}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:6 }}>
                        <span style={{ color:"#EAF3EC", fontWeight:600, fontSize:12.5 }}>{h.ticker}</span>
                        <span style={{ ...S.dim, fontSize:10.5 }}>{h.name}</span>
                      </div>
                      <div style={S.buyAmt}>{M(amt)}</div>
                      <div style={{ ...S.dim, fontSize:10.5, fontFamily:MONO }}>
                        {(sh*100).toFixed(0)}٪ من الخط{h.price>0 && `  ·  ≈ ${(amt/h.price).toFixed(2)} وحدة`}
                      </div>
                      {cur === "USD" && rate > 0 && amt > 0 && (
                        <div style={{ fontSize:11, color:"#5EC8FF", fontFamily:MONO, marginTop:3 }}>
                          د.ك {(amt / rate).toLocaleString("en-US", { maximumFractionDigits: 0 })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </React.Fragment>
  );
}

function Editor({ h, onSave, onCancel, onDelete }) {
  const [f, setF] = useState(h);
  const set = (k,v) => setF(p => ({ ...p, [k]:v }));
  const valid = f.name.trim() && f.ticker.trim();
  return (
    <div style={S.overlay} onClick={onCancel}>
      <div style={S.modal} onClick={e => e.stopPropagation()}>
        <div style={S.mHead}>
          <h3 style={S.mTitle}>{f._new ? "ضم لاعب جديد" : "تعديل المركز"}</h3>
          <button onClick={onCancel} style={S.close}>×</button>
        </div>
        <div style={S.formGrid}>
          <div style={{ display:"flex", flexDirection:"column", gridColumn:"1 / -1" }}>
            <span style={S.label}>الخط</span>
            <div style={{ display:"flex", gap:6, marginTop:6, flexWrap:"wrap" }}>
              {ORDER.map(k => (
                <button key={k} onClick={() => set("line",k)}
                  style={{ ...S.lineBtn, ...(f.line===k?{background:LINES[k].color,color:"#08130E",borderColor:LINES[k].color,fontWeight:700}:{}) }}>
                  {LINES[k].short}
                </button>
              ))}
            </div>
          </div>
          <Field label="الاسم"  text value={f.name}   onChange={v => set("name",v)} />
          <Field label="الرمز"  text value={f.ticker} onChange={v => set("ticker",v)} />
          <Field label="عدد الأسهم"    value={f.qty}   step="any" onChange={v => set("qty",num(parseFloat(v)))} />
          <Field label="سعر التكلفة"   value={f.cost}  step="any" onChange={v => set("cost",num(parseFloat(v)))} />
          <Field label="السعر الحالي"  value={f.price} step="any" onChange={v => set("price",num(parseFloat(v)))} />
        </div>
        <div style={S.preview}>
          <span style={S.label}>القيمة السوقية</span>
          <span style={{ fontFamily:MONO, fontSize:19, color:"#EAF3EC", fontWeight:600 }}>
            ${num(f.qty*f.price).toLocaleString("en-US",{maximumFractionDigits:2})}
          </span>
        </div>
        <div style={S.mActions}>
          {!f._new && <button onClick={() => onDelete(f.id)} style={S.danger}>حذف</button>}
          <div style={{ flex:1 }} />
          <button onClick={onCancel} style={S.ghost}>إلغاء</button>
          <button onClick={() => valid && onSave({ ...f, _new:undefined })} style={{ ...S.primary, opacity:valid?1:0.4 }}>حفظ</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════ عناصر ═══════════════ */
function Field({ label, value, onChange, step, text }) {
  // نحتفظ بنص محلي أثناء الكتابة حتى لا يلتصق الصفر ببداية الرقم
  const [draft, setDraft] = useState(null);
  const shown = draft !== null ? draft : String(value ?? "");

  return (
    <label style={{ display:"flex", flexDirection:"column", minWidth:160, flex:1 }}>
      <span style={S.label}>{label}</span>
      <input
        type={text ? "text" : "number"}
        step={step}
        value={shown}
        onFocus={e => { setDraft(""); requestAnimationFrame(() => e.target.select()); }}
        onChange={e => {
          const v = e.target.value;
          setDraft(v);
          onChange(v === "" ? (text ? "" : "0") : v);
        }}
        onBlur={() => setDraft(null)}
        style={S.input}
      />
    </label>
  );
}

function Stat({ label, value, sub, tone }) {
  return (
    <div style={S.statCard}>
      <div style={S.label}>{label}</div>
      <div style={{ ...S.statVal, color:tone }}>{value}</div>
      {sub && <div style={{ ...S.dim, fontSize:11.5, marginTop:2, fontFamily:MONO }}>{sub}</div>}
    </div>
  );
}

function Head({ title, note, flush }) {
  return (
    <div style={{ marginBottom: flush?0:18 }}>
      <h2 style={S.h2}>{title}</h2>
      {note && <div style={S.note}>{note}</div>}
    </div>
  );
}

function CloudBadge({ state }) {
  const m = {
    idle:   ["", "#4A6255"],
    saving: ["يحفظ…", "#E5B143"],
    saved:  ["محفوظ ✓", "#37C793"],
    error:  ["تعذّر الحفظ", "#E4574C"],
    auth:   ["انتهت الجلسة", "#E4574C"],
  };
  const [t, c] = m[state] || m.idle;
  if (!t) return null;
  return <span style={{ fontSize:11.5, color:c }}>{t}</span>;
}

}

function Root() {

  if (!pass) return <Gate onOk={setP} />;
  return <App pass={pass} onLogout={() => { clearPass(); setP(""); }} />;
}
